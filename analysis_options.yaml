# Strict analysis, no flutter_lints (the rule list below is the whole set, so
# nothing is added or changed by a package upgrade). `tool/check_architecture.dart`
# adds the rules a linter cannot express.
analyzer:
  exclude:
    - lib/l10n/app_localizations*.dart # generated by `flutter gen-l10n`, committed
    - legacy/** # pre-refactor reference code, deleted when the port finishes
    - build/**
    - android/**
    - ios/**
    - web/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    todo: ignore
linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - use_super_parameters
    - use_key_in_widget_constructors
    - use_build_context_synchronously
    - sized_box_for_whitespace
    - always_use_package_imports
    - avoid_relative_lib_imports
    - depend_on_referenced_packages
    - sort_pub_dependencies
