name: link_2_chat
description: "A Web App to convert phone numbers into WhatsApp/Telegram links with analytics dashboard."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  crypto: ^3.0.8
  cupertino_ui: ^1.1.7
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  material_ui: ^1.11.1
  package_info_plus: ^10.2.2
  path: ^1.9.1
  phone_form_field: ^12.0.5
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.6
  sqflite_common_ffi_web: ^1.2.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  web: ^1.1.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"
